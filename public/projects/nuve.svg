<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!-- NUVE — Interactive Cocktail Experience -->
  <rect width="1200" height="800" fill="#0a0a0a"/>
  <!-- Grain texture -->
  <g fill="#ffffff" fill-opacity="0.03">
    <circle cx="100" cy="100" r="1"/><circle cx="300" cy="200" r="1"/>
    <circle cx="500" cy="80" r="1"/><circle cx="700" cy="150" r="1"/>
    <circle cx="900" cy="100" r="1"/><circle cx="1100" cy="200" r="1"/>
    <circle cx="200" cy="400" r="1"/><circle cx="600" cy="300" r="1"/>
    <circle cx="1000" cy="500" r="1"/><circle cx="400" cy="600" r="1"/>
  </g>
  <!-- Left tropical leaf -->
  <g transform="translate(60, 180) rotate(-15)">
    <path d="M0 200 C -40 100, -20 0, 60 -20 C 140 -40, 200 20, 180 120 C 160 220, 80 260, 0 200 Z" fill="#1a3a1a"/>
    <path d="M20 180 C 0 100, 40 20, 100 0" stroke="#2a5a2a" stroke-width="2" fill="none"/>
    <path d="M40 160 C 60 100, 100 40, 140 20" stroke="#2a5a2a" stroke-width="1.5" fill="none"/>
    <path d="M30 140 C 30 80, 60 20, 100 0" stroke="#2a5a2a" stroke-width="1" fill="none"/>
  </g>
  <!-- Right tropical leaf -->
  <g transform="translate(1020, 120) rotate(15) scale(-1,1)">
    <path d="M0 200 C -40 100, -20 0, 60 -20 C 140 -40, 200 20, 180 120 C 160 220, 80 260, 0 200 Z" fill="#1a3a1a"/>
    <path d="M20 180 C 0 100, 40 20, 100 0" stroke="#2a5a2a" stroke-width="2" fill="none"/>
    <path d="M40 160 C 60 100, 100 40, 140 20" stroke="#2a5a2a" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Cocktail glass -->
  <g transform="translate(520, 280)">
    <path d="M80 0 L 160 0 L 120 120 L 40 120 Z" fill="#1a2a1a" stroke="#3a5a3a" stroke-width="1.5"/>
    <path d="M80 0 L 160 0 L 120 120 L 40 120 Z" fill="#0a1a0a" fill-opacity="0.5"/>
    <!-- Liquid -->
    <path d="M85 20 L 155 20 L 120 110 L 50 110 Z" fill="#1a3a2a" fill-opacity="0.6"/>
    <!-- Lime slice -->
    <circle cx="140" cy="30" r="25" fill="#2a4a2a" stroke="#4a7a4a" stroke-width="1"/>
    <circle cx="140" cy="30" r="18" fill="#3a5a3a"/>
    <path d="M140 12 L 140 48 M 122 30 L 158 30 M 127 17 L 153 43 M 153 17 L 127 43" stroke="#4a7a4a" stroke-width="0.5"/>
    <!-- Umbrella -->
    <path d="M60 -10 L 100 -50 L 140 -10 Z" fill="#8a2a2a" stroke="#aa4a4a" stroke-width="0.5"/>
    <line x1="100" y1="-50" x2="100" y2="-10" stroke="#aa4a4a" stroke-width="1"/>
  </g>
  <!-- Brand -->
  <text x="80" y="50" font-family="sans-serif" font-size="16" font-weight="600" fill="#f2f0eb">Velvet Pour</text>
  <!-- Nav -->
  <text x="820" y="50" font-family="sans-serif" font-size="12" fill="#f2f0eb" fill-opacity="0.7">Cocktails</text>
  <text x="920" y="50" font-family="sans-serif" font-size="12" fill="#f2f0eb" fill-opacity="0.7">About Us</text>
  <text x="1020" y="50" font-family="sans-serif" font-size="12" fill="#f2f0eb" fill-opacity="0.7">The Art</text>
  <text x="1120" y="50" font-family="sans-serif" font-size="12" fill="#f2f0eb" fill-opacity="0.7">Contact</text>
  <!-- Main title -->
  <text x="600" y="220" font-family="Georgia, serif" font-size="120" font-weight="400" fill="#f2f0eb" text-anchor="middle">Nuvé</text>
  <!-- Tagline left -->
  <text x="80" y="480" font-family="sans-serif" font-size="11" fill="#f2f0eb" fill-opacity="0.5">Cool. Crisp. Classic.</text>
  <text x="80" y="530" font-family="Georgia, serif" font-size="36" font-style="italic" fill="#C9A96E">Sip the Spirit</text>
  <text x="80" y="575" font-family="Georgia, serif" font-size="36" font-style="italic" fill="#C9A96E">of Summer</text>
  <!-- Description right -->
  <text x="1120" y="480" font-family="sans-serif" font-size="13" fill="#f2f0eb" fill-opacity="0.7" text-anchor="end">Every cocktail on our menu is a</text>
  <text x="1120" y="500" font-family="sans-serif" font-size="13" fill="#f2f0eb" fill-opacity="0.7" text-anchor="end">blend of premium ingredients,</text>
  <text x="1120" y="520" font-family="sans-serif" font-size="13" fill="#f2f0eb" fill-opacity="0.7" text-anchor="end">creative flair, and timeless recipes</text>
  <text x="1120" y="540" font-family="sans-serif" font-size="13" fill="#f2f0eb" fill-opacity="0.7" text-anchor="end">— designed to delight your senses.</text>
  <text x="1120" y="580" font-family="sans-serif" font-size="12" fill="#f2f0eb" text-anchor="end">View cocktails</text>
</svg>
